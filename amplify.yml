version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --ignore-scripts
        - |
          API_URL="${WAITLIST_API_URL:-$VITE_API_BASE_URL}"
          API_URL="${API_URL%/}"
          if [ -n "$API_URL" ]; then
            printf '/api/<*>\t%s/api/<*>\t200\n/*\t/index.html\t200\n' "$API_URL" > public/_redirects
            echo "Waitlist API proxy → $API_URL"
          else
            printf '/*\t/index.html\t200\n' > public/_redirects
            echo "WARNING: Set WAITLIST_API_URL in Amplify env vars after deploying the API (docs/DEPLOY_API.md)"
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
