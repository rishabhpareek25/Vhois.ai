version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --ignore-scripts
        - |
          API_URL="${WAITLIST_API_URL:-$VITE_API_BASE_URL}"
          API_URL="${API_URL%/}"
          if [ -n "$API_URL" ]; then
            echo "VITE_API_BASE_URL=$API_URL" > .env.production
            echo "Waitlist API (direct): $API_URL"
          else
            echo "WARNING: Set WAITLIST_API_URL in Amplify env vars (docs/DEPLOY_API.md)"
          fi
          printf '/*\t/index.html\t200\n' > public/_redirects
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
