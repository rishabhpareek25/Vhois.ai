version = 0.1

[default.global.parameters]
stack_name = "vhois-waitlist"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "vhois-waitlist"
region = "ap-south-1"
parameter_overrides = "AdminSecret=\"vhois-admin-dev\""
