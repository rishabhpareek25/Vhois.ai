name: Deploy Waitlist API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "lambda/**"
      - ".github/workflows/deploy-waitlist-api.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Must match infra/samconfig.toml region (stack deploy target)
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build and deploy
        working-directory: infra
        env:
          ADMIN_SECRET: ${{ secrets.WAITLIST_ADMIN_SECRET || 'vhois-admin-dev' }}
        run: |
          sam build
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AdminSecret=${ADMIN_SECRET}"

      - name: Output API URL
        id: api
        working-directory: infra
        env:
          DEPLOY_REGION: us-east-1
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name vhois-waitlist \
            --region "$DEPLOY_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
            --output text)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "Could not read stack output; check region $DEPLOY_REGION"
            exit 1
          fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "## Waitlist API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**ApiBaseUrl:** \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Amplify (required)" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Amplify Console → your app → **Environment variables**" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Add \`WAITLIST_API_URL\` = \`$URL\` (no trailing slash)" >> "$GITHUB_STEP_SUMMARY"
          echo "3. **Redeploy** the Amplify app" >> "$GITHUB_STEP_SUMMARY"
